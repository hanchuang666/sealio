<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sealio Web</title>
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111827; color: #f9fafb; }
      main { max-width: 760px; margin: 80px auto; padding: 32px; background: #1f2937; border-radius: 20px; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      h1 { margin-top: 0; }
      section { margin-top: 28px; padding-top: 24px; border-top: 1px solid #374151; }
      input, button { font: inherit; }
      button { margin-left: 10px; padding: 8px 14px; border: 0; border-radius: 10px; background: #38bdf8; color: #082f49; cursor: pointer; font-weight: 700; }
      pre { white-space: pre-wrap; background: #0f172a; padding: 16px; border-radius: 12px; color: #bfdbfe; }
      a { color: #7dd3fc; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sealio 后端已运行</h1>
      <p>这是服务器上的临时验证页。正式 React 前端接入后，会替换这个页面。</p>
      <section>
        <h2>上传图章</h2>
        <input id="stamp" type="file" accept=".png,.jpg,.jpeg" multiple />
        <button onclick="upload('/api/stamps', 'stamp')">上传</button>
      </section>
      <section>
        <h2>临时文件上传</h2>
        <input id="document" type="file" accept=".pdf,.png,.jpg,.jpeg" multiple />
        <button onclick="upload('/api/uploads', 'document')">上传</button>
      </section>
      <section>
        <h2>结果</h2>
        <pre id="output">等待操作...</pre>
      </section>
    </main>
    <script>
      async function upload(url, inputId) {
        const files = document.getElementById(inputId).files;
        const output = document.getElementById('output');
        if (!files.length) {
          output.textContent = '请选择文件';
          return;
        }
        const form = new FormData();
        for (const file of files) form.append('file', file);
        const response = await fetch(url, { method: 'POST', body: form });
        output.textContent = JSON.stringify(await response.json(), null, 2);
      }
      fetch('/api/health').then((r) => r.json()).then((data) => {
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      });
    </script>
  </body>
</html>
